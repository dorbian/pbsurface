[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playbook-surface-host"
version = "0.1.0"
description = "Modern endpoint agent for PlayBook Surface"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
playbook-surface-host = "playbook_surface_host.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

